<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BrowserGuard warning</title>
  <link rel="stylesheet" href="warning.css">
</head>
<body>
  <main class="warning-shell">
    <div class="warning-brand"><span>B</span><strong>BrowserGuard</strong></div>
    <p class="eyebrow">NAVIGATION BLOCKED</p>
    <h1 id="warning-title">This destination was blocked.</h1>
    <p class="intro" id="warning-summary"></p>
    <section class="destination"><span>DESTINATION</span><strong id="destination"></strong></section>
    <section class="reason-section"><h2>Why it was blocked</h2><ul id="reasons"></ul></section>
    <section class="check-explanation"><h2>How BrowserGuard checked</h2><p id="check-method"></p><p id="risk-score" class="risk-score"></p></section>
    <div class="actions"><button id="back" class="primary" type="button">Go back</button><button id="continue" class="text-button" type="button">Continue anyway</button></div>
    <p class="caution-note">Only continue if you recognize and trust this address. Your organization’s block list may still apply.</p>
  </main>
  <script src="warning.js"></script>
</body>
</html>
